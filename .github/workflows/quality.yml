name: Browser and integrity tests

on:
  push:
    branches:
      - ux-redesign/phase-1-daily-entry
  pull_request:
    branches:
      - ux-redesign/phase-1-daily-entry

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit and browser tests
        run: npm run test:all
      - name: Production build
        run: npm run build
